name: Bug report
description: Report a reproducible Archlence problem without exposing private data.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Archlence. Never attach a real database, keys, recovery material, credentials, or unredacted financial information. Report suspected vulnerabilities through a private security advisory, not this form.
  - type: input
    id: version
    attributes:
      label: Archlence version
      description: Use the release tag or commit hash.
      placeholder: v0.0.x or commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2, Ubuntu 26.04, Arch Linux, macOS 15
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Windows installer
        - Archlence-bin PKGBUILD
        - AppImage
        - Source checkout
        - GitHub Actions artifact
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Start from a known state and number each action.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include whether the application remained usable and whether data changed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the smallest sanitized excerpt. Remove names, amounts, descriptions, credentials, keys, tokens, and private paths.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag in sample-data media only. Redact all personal and financial information.
  - type: dropdown
    id: data_kind
    attributes:
      label: Data used when reproducing
      options:
        - Generated sample data
        - Real data, fully redacted from this report
        - No financial data involved
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real financial information, credentials, keys, recovery material, and identifying paths from this report.
          required: true
        - label: This is not a vulnerability report; security findings must use a private GitHub security advisory.
          required: true
