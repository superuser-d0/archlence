name: Release

# NEDEN BU DOSYA VAR: build-windows.yml / build-linux.yml yalnızca **artifact**
# üretir. GitHub Actions artifact'leri son kullanıcıya dağıtım için uygun DEĞİL:
# indirmek için GitHub hesabıyla oturum açmak gerekir ve varsayılan olarak 90
# günde silinirler. Kalıcı, herkese açık, doğrudan indirilebilir bir bağlantı
# ancak bir GitHub **Release** varlığıyla olur — bu workflow onu üretir.
#
# Kullanım (sürümü kesmek):
#   git tag v1.0.1 && git push origin v1.0.1
# Etiketin `v` ile başlaması yeterli; sürüm numarası etiketten türetilir ve
# Inno Setup kurulumuna gömülür (bkz. installer/archlence.iss'in #ifndef bloğu).
#
# Derleme tarifleri BURADA TEKRARLANMAZ: iki platform workflow'u `workflow_call`
# ile çağrılır. Kopyalamak, ANGLE arka ucu / xvfb / smoke test gibi zor kazanılmış
# ayrıntıların zamanla iki yerde birbirinden ayrışması anlamına gelirdi.
on:
  push:
    tags: [ "v*" ]
  # Etiket atmadan uçtan uca denemek için (taslak release üretir).
  workflow_dispatch:
    inputs:
      version:
        description: "Deneme sürümü (ör. 0.0.0-test)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # yayın işini yarıda kesmek istemiyoruz

permissions:
  contents: write   # release oluşturmak/varlık yüklemek için gerekli

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Sürümü belirle
        id: derive
        shell: bash
        # Etiketle tetiklendiyse `refs/tags/v1.2.3` -> `1.2.3`; elle
        # tetiklendiyse girdideki değer kullanılır.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF#refs/tags/}"
            version="${version#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [ -z "$version" ]; then
            echo "::error::Sürüm belirlenemedi."
            exit 1
          fi
          expected="$(python -c 'from utils.version import APP_VERSION; print(APP_VERSION)')"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag/input sürümü ($version) uygulama sürümüyle ($expected) eşleşmiyor."
            exit 1
          fi

          # Ön-sürüm mü? İki kural:
          #   * `0.` ile başlıyorsa (0.x = henüz 1.0 değil, semver kuralı)
          #   * `-` içeriyorsa (0.9.0-rc1, 1.0.0-beta gibi semver ön-sürüm eki)
          # Bu işaret olmadan 0.9.0 GitHub'da "Latest release" olarak tam
          # prominence ile görünür ve kararlı bir sürümmüş gibi durur.
          case "$version" in
            0.*|*-*) prerelease=true ;;
            *)       prerelease=false ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $version (ön-sürüm: $prerelease)"

  build-windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  build-linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml

  publish:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Windows kurulum paketini indir
        uses: actions/download-artifact@v4
        with:
          name: Archlence-Setup
          path: assets-in/windows

      - name: Linux AppImage'ı indir
        uses: actions/download-artifact@v4
        with:
          name: Archlence-AppImage
          path: assets-in/linux

      - name: Varlıkları sürümlü adlarla hazırla
        shell: bash
        # Derleme tarafındaki dosya adları bilerek sabit (Archlence-x86_64.
        # AppImage / ArchlenceSetup.exe). Sürümü yalnızca burada, yayınlanacak
        # kopyaya ekliyoruz: kullanıcı birkaç sürümü aynı klasöre indirdiğinde
        # dosyalar birbirini ezmesin.
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p release-assets
          cp "assets-in/windows/ArchlenceSetup.exe" \
             "release-assets/ArchlenceSetup-${v}.exe"
          cp "assets-in/linux/Archlence-x86_64.AppImage" \
             "release-assets/Archlence-${v}-x86_64.AppImage"
          cp THIRD_PARTY_NOTICES.md release-assets/
          (
            cd release-assets
            sha256sum "ArchlenceSetup-${v}.exe" \
              "Archlence-${v}-x86_64.AppImage" \
              THIRD_PARTY_NOTICES.md > SHA256SUMS.txt
          )
          ls -la release-assets

      - name: CHANGELOG'dan sürüm notlarını yaz
        shell: bash
        run: |
          python scripts/release_notes_from_changelog.py \
            "${{ needs.version.outputs.version }}" \
            --output release-notes.md
          cat release-notes.md

      - name: CycloneDX SBOM üret
        shell: bash
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py requirements requirements-runtime.txt \
            --output-format JSON \
            --output-file "release-assets/Archlence-${{ needs.version.outputs.version }}-sbom.cdx.json"
          (
            cd release-assets
            sha256sum "Archlence-${{ needs.version.outputs.version }}-sbom.cdx.json" \
              >> SHA256SUMS.txt
          )

      - name: Draft release oluştur ve varlıkları ekle
        shell: bash
        # `gh` runner'da hazır kurulu geliyor. Üçüncü taraf bir release action'ı
        # yerine bilinçli olarak bu tercih edildi: bu iş `contents: write`
        # yetkisiyle koşuyor ve o yetkiyi repo dışı bir action'a açmak gereksiz
        # bir tedarik zinciri yüzeyi olurdu.
        #
        # --repo ZORUNLU: bu iş yalnızca artifact indiriyor, kaynak ağacı
        # checkout ETMİYOR. `gh` hedef repoyu normalde git remote'undan
        # çıkarır; checkout olmadığı için `fatal: not a git repository` ile
        # düşüyordu (ilk deneme koşusunda böyle yakalandı). Sadece bu bayrak
        # için koca bir checkout eklemek gereksiz olurdu.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v${v}"
          fi
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi
          gh release create "$tag" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Archlence v${v}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            $prerelease_flag \
            --draft

      - name: GitHub'dan yeniden indir ve SHA-256 doğrula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.version }}"
          mkdir downloaded
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --dir downloaded
          cp downloaded/SHA256SUMS.txt downloaded/expected.txt
          (
            cd downloaded
            sha256sum -c expected.txt
          )

      - name: Tag push ise stable/latest olarak yayımla
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release edit "$tag" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false \
            --latest
          echo "Yayınlandı: $(gh release view "$tag" --repo "${{ github.repository }}" --json url -q .url)"
