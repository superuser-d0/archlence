name: Build Linux AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

  workflow_call: {}

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python

        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies

        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller

      - name: Build with PyInstaller

        run: xvfb-run -a pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: Upload unpacked application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Linux
          path: dist/Archlence/
          if-no-files-found: error

      - name: Create AppDir

        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Archlence AppDir/usr/bin/Archlence
          cp installer/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp assets/archlence.desktop AppDir/Archlence.desktop
          cp assets/icon.png AppDir/archlence.png

      - name: Download appimagetool

        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          set -euo pipefail
          url="https://github.com/AppImage/appimagetool/releases/download/${{ env.APPIMAGETOOL_VERSION }}/appimagetool-x86_64.AppImage"
          wget -q "$url" -O appimagetool
          echo "${{ env.APPIMAGETOOL_SHA256 }}  appimagetool" | sha256sum -c - || {
            echo "::error::appimagetool checksum mismatch. Expected: ${{ env.APPIMAGETOOL_SHA256 }}"
            echo "::error::Actual: $(sha256sum appimagetool | cut -d' ' -f1)"
            exit 1
          }
          chmod +x appimagetool

      - name: Build AppImage
        run: ./appimagetool --appimage-extract-and-run AppDir dist/Archlence-x86_64.AppImage

      - name: Scan package contents and secrets
        run: python scripts/inspect_package_contents.py dist/Archlence

      - name: "Smoke test: AppImage stays alive in a real SDL window"

        run: |
          set -euo pipefail
          chmod +x dist/Archlence-x86_64.AppImage
          smoke_state="$RUNNER_TEMP/archlence-smoke-state"
          crash_log="$smoke_state/Archlence/log/crash.log"
          rm -rf "$smoke_state"
          set +e
          XDG_DATA_HOME="$RUNNER_TEMP/archlence-smoke-data" \
          XDG_CACHE_HOME="$RUNNER_TEMP/archlence-smoke-cache" \
          XDG_STATE_HOME="$smoke_state" \
          timeout 12s xvfb-run -a \
            dist/Archlence-x86_64.AppImage --appimage-extract-and-run
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "::error::AppImage did not stay alive for 12 seconds (status=$status)."
            exit 1
          fi
          if [ -s "$crash_log" ]; then
            echo "::error::AppImage stayed alive but wrote to crash.log; a caught exception may have been suppressed. Last lines:"
            tail -n 40 "$crash_log"
            exit 1
          fi
          echo "Smoke test passed: alive for 12 seconds with an empty crash.log."

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-AppImage
          path: dist/Archlence-x86_64.AppImage
          if-no-files-found: error
