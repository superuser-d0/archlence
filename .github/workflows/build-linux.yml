name: Build Linux AppImage

# build-windows.yml ile aynı tetikleyici/concurrency deseni — PyInstaller
# çapraz derleme yapamadığı için bu iş yalnızca Linux runner'ında çalışır.
#
# İKİ artifact üretir:
#   - Archlence-Linux: ham "onedir" klasörü (Archlence ikilisi + yanındaki
#     .so/kaynak klasörü) — geliştirici/debug amaçlı.
#   - Archlence-AppImage: tek dosyalık Archlence-x86_64.AppImage — son
#     kullanıcı/test için, çalıştırma izni verip çift tıklayarak/`./` ile
#     doğrudan çalıştırılır, kurulum gerektirmez.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
  # release.yml tarafından çağrılır — bkz. build-windows.yml'deki aynı not.
  # AppImage dosya adı bilerek sürümsüz/sabit tutuluyor; sürümlü isim release
  # yayınlama adımında yeniden adlandırılarak veriliyor, böylece burada
  # çalışan derleme/artifact yollarına hiç dokunulmuyor.
  workflow_call: {}

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Python kur
        # KARAR (kilitli, 2026-07-29) — build-windows.yml'deki notla aynı:
        # paketleme her iki platformda da 3.12'ye sabit, yerel geliştirme
        # ortamından (3.14.6) bilerek bağımsız. Tutarlılık için değiştirilecekse
        # ikisi birden güncellenmeli.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        # requirements-runtime.txt Windows'takiyle aynı dosya — kivy_deps
        # (sdl2/glew/angle) yalnızca Windows'a özgü DLL bundling paketleri,
        # burada gerekmiyor (bkz. archlence.spec'teki IS_WINDOWS dalı).
        # xvfb: aşağıdaki derleme adımı gerçek bir OpenGL bağlamı gerektiriyor
        # (bkz. o adımdaki not) — ubuntu-latest imajında hazır gelmiyor.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller

      - name: PyInstaller ile derle
        # archlence.spec'teki `collect_all("kivymd")` kivymd'yi gerçekten
        # import ediyor; kivymd/material_resources.py modül seviyesinde
        # `dp(400)` çağırıyor, bu da Kivy'nin Window/GL singleton'ını GERÇEKTEN
        # tetikliyor (bkz. archlence.spec'teki not). Windows'ta bu ANGLE ile
        # çözülüyor. Burada önce SDL'nin "dummy" video sürücüsü denendi
        # (run_tests.py'nin headless test deseni) ama İŞE YARAMADI — dummy
        # sürücü hiçbir OpenGL yüzeyi sağlamıyor ("OpenGL support is either
        # not configured in SDL or not available in current SDL video driver
        # (dummy)"), oysa bu adım gerçek (yazılım da olsa) bir GL bağlamı
        # istiyor. Çözüm: `xvfb-run` ile sanal ama GERÇEK bir X11 ekranı
        # açmak — Mesa'nın llvmpipe yazılım rasterizer'ı üzerinden çalışan
        # bağlam Kivy'nin OpenGL şartını karşılıyor. Yerel bir Linux
        # makinesinde `xvfb-run -a pyinstaller ... archlence.spec` ile
        # doğrulandı (dist/Archlence/Archlence üretildi, ~290 MB onedir).
        run: xvfb-run -a pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: Ham dizini artifact olarak yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Linux
          path: dist/Archlence/
          if-no-files-found: error

      - name: AppDir oluştur
        # archlence.spec bilerek "onedir" derliyor (bkz. o dosyadaki not) —
        # AppRun bu klasörün TAMAMINI olduğu gibi kopyalayıp içindeki gerçek
        # ikiliyi çalıştırıyor, PyInstaller'ın iç düzenini bilmesi gerekmiyor
        # (bkz. installer/appimage/AppRun'daki not).
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/Archlence AppDir/usr/bin/Archlence
          cp installer/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp assets/archlence.desktop AppDir/Archlence.desktop
          cp assets/icon.png AppDir/archlence.png

      - name: appimagetool indir
        # appimagetool'un kendisi de bir AppImage; --appimage-extract-and-run
        # FUSE'a ihtiyaç duymadan çalıştırır (ubuntu-latest runner'larında
        # libfuse2 artık varsayılan kurulu değil).
        #
        # SABİT SÜRÜM + CHECKSUM. Eskiden `continuous` etiketinden, hiçbir
        # doğrulama olmadan indiriliyordu. `continuous` sürekli yeniden
        # üretilen hareketli bir yayındır: derlemeye giren ikili herhangi bir
        # gün habersiz değişebilir ve paketlenen AppImage'a karışabilirdi.
        #
        # Checksum uyuşmazsa derleme DURUR. Bu, upstream 1.9.1 artifact'ini
        # yeniden yayımlarsa da tetiklenir; o durumda yeni ikili incelenip
        # buradaki değer BİLİNÇLİ olarak güncellenmelidir — sessizce kabul
        # edilmemelidir.
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          set -euo pipefail
          url="https://github.com/AppImage/appimagetool/releases/download/${{ env.APPIMAGETOOL_VERSION }}/appimagetool-x86_64.AppImage"
          wget -q "$url" -O appimagetool
          echo "${{ env.APPIMAGETOOL_SHA256 }}  appimagetool" | sha256sum -c - || {
            echo "::error::appimagetool checksum uyusmadi. Beklenen: ${{ env.APPIMAGETOOL_SHA256 }}"
            echo "::error::Gercek: $(sha256sum appimagetool | cut -d' ' -f1)"
            exit 1
          }
          chmod +x appimagetool

      - name: AppImage oluştur
        run: ./appimagetool --appimage-extract-and-run AppDir dist/Archlence-x86_64.AppImage

      - name: Paket içeriği ve secret taraması
        run: python scripts/inspect_package_contents.py dist/Archlence

      - name: "Smoke test: AppImage gerçek SDL penceresinde çalışıyor"
        # İKİ ayrı kontrol, ikisi de gerekli:
        #   (1) süreç 12 saniye ayakta mı — sessizce kapanmadı mı,
        #   (2) crash.log'a bir şey yazıldı mı — süreç AYAKTA KALIP yakalanmış
        #       bir istisnayı loglamış olabilir; o hâlde uygulama açılır ama
        #       ekran bozuk gelir ve (1) bunu göremez.
        # (2) build-windows.yml'deki ham .exe smoke testinde zaten vardı,
        # burada YOKTU. Aynı asimetri installer smoke testinde de vardı;
        # ikisi de bu değişiklikle eşitlendi.
        #
        # XDG_STATE_HOME bilerek sandbox'lanıyor: `utils.app_paths.log_dir()`
        # crash.log'u oraya yazar (ölçüldü: $XDG_STATE_HOME/Archlence/log/).
        # Sandbox'lanmazsa runner'ın gerçek state dizinine yazar ve temiz bir
        # taban çizgisi kalmaz.
        #
        # DİKKAT — "dosya var mı" diye BAKMAYIN: crash.log main.py import
        # edilirken BOŞ olarak açılıyor, yani her zaman var olur. Ölçüldü:
        # sağlıklı çalıştırmada 0 bayt, yakalanmamış bir istisnada dolu.
        # Doğru kontrol bu yüzden `-s` (boş değil).
        run: |
          set -euo pipefail
          chmod +x dist/Archlence-x86_64.AppImage
          smoke_state="$RUNNER_TEMP/archlence-smoke-state"
          crash_log="$smoke_state/Archlence/log/crash.log"
          rm -rf "$smoke_state"
          set +e
          XDG_DATA_HOME="$RUNNER_TEMP/archlence-smoke-data" \
          XDG_CACHE_HOME="$RUNNER_TEMP/archlence-smoke-cache" \
          XDG_STATE_HOME="$smoke_state" \
          timeout 12s xvfb-run -a \
            dist/Archlence-x86_64.AppImage --appimage-extract-and-run
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "::error::AppImage 12 saniye ayakta kalmadı (status=$status)."
            exit 1
          fi
          if [ -s "$crash_log" ]; then
            echo "::error::AppImage ayakta kaldı ama crash.log'a yazıldı — yakalanmış ama sessiz kalmış bir istisna olabilir. Son satırlar:"
            tail -n 40 "$crash_log"
            exit 1
          fi
          echo "Smoke test geçti: 12 saniye ayakta, crash.log boş."

      - name: AppImage'ı artifact olarak yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-AppImage
          path: dist/Archlence-x86_64.AppImage
          if-no-files-found: error
