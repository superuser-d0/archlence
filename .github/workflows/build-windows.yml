name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

  workflow_call:
    inputs:
      version:
        description: "Version embedded in the installer (derived from the tag)."
        required: false
        type: string
        default: "1.0.0"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:

          fetch-depth: 0

      - name: Set up Python

        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip   # Reuse downloaded dependencies between runs.

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: Build with PyInstaller

        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: "Smoke test: Archlence.exe opens and stays healthy"

        shell: pwsh
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          $ErrorActionPreference = "Stop"
          $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $smokeHome = [IO.Path]::GetFullPath((Join-Path $runnerRoot "Archlence-Packaged-Profile"))
          if (-not $smokeHome.StartsWith($runnerRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Packaged smoke profile escaped RUNNER_TEMP: $smokeHome"
          }
          if (Test-Path $smokeHome) {
            Remove-Item -LiteralPath $smokeHome -Recurse -Force
          }
          $env:ARCHLENCE_HOME = $smokeHome
          $crashLogPath = Join-Path $smokeHome "logs\crash.log"
          $beforeSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }

          $proc = Start-Process -FilePath "dist\Archlence\Archlence.exe" -PassThru
          Start-Sleep -Seconds 10

          $stillAlive = -not $proc.HasExited
          if (-not $stillAlive) {
            Write-Host "::error::Archlence.exe exited within 10 seconds (exit code: $($proc.ExitCode)); the Window may have remained None (see the KIVY_GL_BACKEND note in archlence.spec)."
          }

          $afterSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }
          $crashLogGrew = $afterSize -gt $beforeSize
          if ($crashLogGrew) {
            Write-Host "::error::crash.log grew during this run; a caught exception may have been suppressed. Last lines:"
            Get-Content $crashLogPath -Tail 40
          }

          if ($stillAlive) {
            Stop-Process -Id $proc.Id -Force
          }

          if ((-not $stillAlive) -or $crashLogGrew) {
            exit 1
          }
          Write-Host "Smoke test passed: Archlence.exe stayed alive for 10 seconds and crash.log did not grow."

          python scripts/dev/verify_packaged_windows_profile.py --home $smokeHome

      - name: "Package integrity: include the lazy pywin32 import"

        run: python scripts/check_frozen_lazy_imports.py dist/Archlence

      - name: Scan package contents and secrets
        run: python scripts/inspect_package_contents.py dist/Archlence

      - name: Upload unpacked Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Windows
          path: dist/Archlence/
          if-no-files-found: error

      - name: Build the installer with Inno Setup

        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
            Write-Host "inputs.version is empty; using the central version: $version"
          }
          $central = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -ne $central) {
            Write-Host "::error::Provided version ($version) does not match application version ($central)."
            exit 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Invalid version format: $version"
            exit 1
          }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            installer\archlence.iss

      - name: "Upgrade smoke: open the previous-release profile in the new version"
        shell: pwsh

        timeout-minutes: 10
        env:
          KIVY_GL_BACKEND: angle_sdl2

          UPGRADE_BASELINE_TAG: ""
          UPGRADE_BASELINE_ASSET: ""
          UPGRADE_BASELINE_SHA256: ""
        run: |
          $ErrorActionPreference = "Stop"

          $target = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
          git fetch --tags --quiet
          $baseline = (python scripts/previous_release.py --target $target).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseline)) {
            Write-Host "::warning::Upgrade smoke test skipped: no previous release found for $target."
            exit 0
          }
          $baselineVersion = $baseline.TrimStart("v")
          $env:UPGRADE_BASELINE_TAG = $baseline
          $env:UPGRADE_BASELINE_ASSET = "ArchlenceSetup-$baselineVersion.exe"
          Write-Host "Upgrade baseline: $baseline -> $target"

          $sumsUrl = "https://github.com/${{ github.repository }}/releases/download/$baseline/SHA256SUMS.txt"
          try {

            $response = Invoke-WebRequest $sumsUrl -TimeoutSec 180
            $sums = if ($response.Content -is [byte[]]) {
              [System.Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }
          } catch {
            Write-Host "::error::Unable to download SHA256SUMS.txt for the baseline release: $sumsUrl"
            exit 1
          }
          $line = ($sums -split "`n") | Where-Object { $_ -match [regex]::Escape($env:UPGRADE_BASELINE_ASSET) } | Select-Object -First 1
          if (-not $line) {
            Write-Host "::error::$($env:UPGRADE_BASELINE_ASSET) was not found in the baseline manifest."
            exit 1
          }
          $env:UPGRADE_BASELINE_SHA256 = ($line -split "\s+")[0]

          function Invoke-Bounded {
            param($Proc, [int]$TimeoutSeconds, [string]$Label)
            if (-not $Proc.WaitForExit($TimeoutSeconds * 1000)) {
              try { $Proc.Kill() } catch { }
              Write-Host "::error::$Label did not finish within $TimeoutSeconds seconds."
              exit 1
            }
            [void]$Proc.WaitForExit(10000)
            return $Proc.ExitCode
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Archlence-Upgrade"
          $oldInstaller = Join-Path $env:RUNNER_TEMP $env:UPGRADE_BASELINE_ASSET
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:UPGRADE_BASELINE_TAG)/$($env:UPGRADE_BASELINE_ASSET)"
          try {

            Invoke-WebRequest $url -OutFile $oldInstaller -TimeoutSec 180
          } catch {
            Write-Host "::error::Unable to download the baseline release: $url"
            exit 1
          }
          $oldHash = (Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLower()
          if ($oldHash -ne $env:UPGRADE_BASELINE_SHA256.ToLower()) {
            Write-Host "::error::Baseline installer hash mismatch."
            exit 1
          }
          $oldSetup = Start-Process $oldInstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          if ((Invoke-Bounded $oldSetup 120 "Baseline installation") -ne 0) { exit 1 }
          $oldExe = Join-Path $installDir "Archlence.exe"
          $oldProc = Start-Process $oldExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          if ($oldProc.HasExited) {
            Write-Host "::error::Baseline release did not stay running."
            exit 1
          }
          Stop-Process -Id $oldProc.Id -Force

          $db = Get-ChildItem $env:LOCALAPPDATA -Filter finance.db -Recurse |
            Where-Object { $_.FullName -match "Archlence" } |
            Select-Object -First 1
          if (-not $db) {
            Write-Host "::error::Baseline release did not create a profile database."
            exit 1
          }
          python -c "import sqlite3; p=r'$($db.FullName)'; c=sqlite3.connect(p); c.execute('INSERT INTO accounts (name,type,balance) VALUES (?,?,?)',('upgrade-sentinel','bank',1234.56)); c.commit(); c.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $newInstaller = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $upgrade = Start-Process $newInstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          if ((Invoke-Bounded $upgrade 120 "Upgrade installation") -ne 0) { exit 1 }
          $newProc = Start-Process $oldExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          if ($newProc.HasExited) {
            Write-Host "::error::Upgraded release did not stay running."
            exit 1
          }
          Stop-Process -Id $newProc.Id -Force
          python -c "import sqlite3; p=r'$($db.FullName)'; c=sqlite3.connect(p); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; assert c.execute('select balance from accounts where name=?',('upgrade-sentinel',)).fetchone()[0]==1234.56; c.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $remove = Start-Process $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $removeExit = Invoke-Bounded $remove 120 "Post-upgrade uninstall"
          if ($removeExit -ne 0 -or -not (Test-Path $db.FullName)) {
            Write-Host "::error::Post-upgrade uninstall did not preserve user data."
            exit 1
          }
          Write-Host "$($env:UPGRADE_BASELINE_TAG) -> current version upgrade/profile-preservation test passed."

      - name: "Smoke test: install, launch, and uninstall"
        shell: pwsh

        timeout-minutes: 10
        env:
          KIVY_GL_BACKEND: angle_sdl2

        run: |

          function Invoke-Bounded {
            param($Proc, [int]$TimeoutSeconds, [string]$Label)
            if (-not $Proc.WaitForExit($TimeoutSeconds * 1000)) {
              try { $Proc.Kill() } catch { }
              Write-Host "::error::$Label did not finish within $TimeoutSeconds seconds."
              exit 1
            }
            [void]$Proc.WaitForExit(10000)
            return $Proc.ExitCode
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Archlence-Installed"
          $installer = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $setup = Start-Process -FilePath $installer -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          $setupExit = Invoke-Bounded $setup 120 "Installer"
          if ($setupExit -ne 0) {
            Write-Host "::error::Installer failed (exit=$setupExit)."
            exit 1
          }
          $exe = Join-Path $installDir "Archlence.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Installed Archlence.exe was not found."
            exit 1
          }
          $crashLogDir = python -c "from utils.app_paths import log_dir; print(log_dir())"
          $crashLogPath = Join-Path $crashLogDir "crash.log"
          $beforeSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }

          $dataDir = python -c "from utils.app_paths import data_dir; print(data_dir())"

          $proc = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 10

          $exitedEarly = $proc.HasExited
          if ($exitedEarly) {
            Write-Host "::error::Installed application exited early (exit=$($proc.ExitCode))."
          }

          $afterSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }
          $crashLogGrew = $afterSize -gt $beforeSize
          if ($crashLogGrew) {
            Write-Host "::error::Installed application stayed alive but crash.log grew; a caught exception may have been suppressed. Last lines:"
            Get-Content $crashLogPath -Tail 40
          }

          if (-not $exitedEarly) {
            Stop-Process -Id $proc.Id -Force
          }
          if ($exitedEarly -or $crashLogGrew) {
            exit 1
          }

          $dbPath = Join-Path $dataDir "finance.db"
          if (-not (Test-Path $dbPath)) {
            Write-Host "::error::Installed application launched but did not create the user profile ($dbPath)."
            exit 1
          }
          $dbSizeBefore = (Get-Item $dbPath).Length

          $uninstaller = Join-Path $installDir "unins000.exe"
          $remove = Start-Process -FilePath $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $removeExit = Invoke-Bounded $remove 120 "Uninstall"
          if ($removeExit -ne 0 -or (Test-Path $exe)) {
            Write-Host "::error::Uninstall could not be verified."
            exit 1
          }

          if (-not (Test-Path $dbPath)) {
            Write-Host "::error::Uninstall deleted the user database ($dbPath). An UninstallDelete entry may have been added to installer/archlence.iss."
            exit 1
          }
          $dbSizeAfter = (Get-Item $dbPath).Length
          if ($dbSizeAfter -ne $dbSizeBefore) {
            Write-Host "::error::Uninstall modified the user database ($dbSizeBefore -> $dbSizeAfter bytes)."
            exit 1
          }
          Write-Host "Installer smoke test passed; user data survived uninstall."

      - name: "Install scope: default target is under the user profile"
        shell: pwsh
        timeout-minutes: 5

        run: |
          $installer = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $setup = Start-Process -FilePath $installer -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"
          if (-not $setup.WaitForExit(120000)) {
            try { $setup.Kill() } catch { }
            Write-Host "::error::Default-target installation did not finish within 120 seconds."
            exit 1
          }
          [void]$setup.WaitForExit(10000)
          if ($setup.ExitCode -ne 0) {
            Write-Host "::error::Default-target installation failed (exit=$($setup.ExitCode))."
            exit 1
          }
          $expected = Join-Path $env:LOCALAPPDATA "Programs\Archlence"
          $exe = Join-Path $expected "Archlence.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Default installation was not found under $expected; install scope may have escaped the user profile."
            Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  found: $($_.FullName)" }
            exit 1
          }
          if (Test-Path (Join-Path $env:ProgramFiles "Archlence")) {
            Write-Host "::error::Installer wrote to a machine-wide Program Files location; per-user scope is broken."
            exit 1
          }
          Write-Host "Default installation target verified: $expected"
          $uninstaller = Join-Path $expected "unins000.exe"
          $remove = Start-Process -FilePath $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          [void]$remove.WaitForExit(120000)
          [void]$remove.WaitForExit(10000)

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Setup
          path: installer_output/ArchlenceSetup.exe
          if-no-files-found: error
