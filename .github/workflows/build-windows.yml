name: Build Windows EXE

# Sadece Windows runner'da çalışır çünkü PyInstaller çapraz derleme yapamaz.
#
# main'i HEDEFLEYEN PR'larda da çalışır. Bu bilerek eklendi: workflow uzun süre
# yalnızca `push: main` ile tetikleniyordu, yani paketleme hataları ancak
# main'e GİRDİKTEN SONRA görülebiliyordu. Pratikte bunun bedeli ödendi —
# derlemeyi tamamen kilitleyen OpenGL hatası (bkz. archlence.spec'teki
# KIVY_GL_BACKEND notu) ilk commit'ten beri main'de duruyordu ve her
# derlemenin 6 saatlik varsayılan zaman aşımına kadar asılı kalmasına yol
# açıyordu; kimse fark etmedi çünkü kırılmayı merge öncesi gösterecek bir
# sinyal yoktu.
#
# Maliyet artık ihmal edilebilir: donma düzeltildikten sonra derleme ~3 dakika
# sürüyor (PyInstaller adımı ~1 dk).
#
# İKİ artifact üretir:
#   - Archlence-Windows: ham "onedir" klasörü (.exe + DLL/kaynak klasörü) —
#     geliştirici/debug amaçlı, elle zip açıp klasör bütünlüğünü koruma
#     gerektirir.
#   - Archlence-Setup: installer/archlence.iss ile üretilen TEK dosyalık
#     ArchlenceSetup.exe — son kullanıcı/test için, çift tıklayıp kurar,
#     Başlat Menüsü kısayolu ve kaldırıcı otomatik gelir, yönetici izni
#     gerektirmez (kullanıcı başına kurulum).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Arka arkaya push'ta eski derleme iptal edilsin; iki Windows runner'ını aynı
# anda meşgul etmenin anlamı yok. PR'larda github.ref `refs/pull/<no>/merge`
# olduğundan her PR kendi grubunu alır; yeni commit push'lanınca o PR'ın eski
# derlemesi iptal olur, başka PR'lar etkilenmez.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Bu sınır olmadan takılan bir adım varsayılan 360 dakikaya kadar runner'ı
    # meşgul ediyor ve elle iptal gerekiyor (34 dakikalık "PyInstaller ile
    # derle" adımı böyle oluşmuştu).
    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # bağımlılıkları her koşuda baştan indirmesin

      - name: Bağımlılıkları kur
        # requirements-runtime.txt: paketlenmiş .exe'nin çalışması için gerekli
        # olanlar. flake8 gibi lint araçlarını (requirements-dev.txt) burada
        # kurmaya gerek yok — build zaten onları archlence.spec'in excludes
        # listesinde ayrıca hariç tutuyor.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: PyInstaller ile derle
        # --noconfirm: dist/ zaten varsa PyInstaller "silinsin mi? (y/N)" diye
        # sorup girdi bekler; CI'da bu, sonsuza kadar asılı kalmak demektir.
        # --log-level WARN: INFO binlerce "analyzing module ..." satırı basıp
        # gerçek uyarıları gömüyordu.
        #
        # KIVY_GL_BACKEND=angle_sdl2: archlence.spec'teki `collect_all("kivymd")`
        # kivymd'yi gerçekten import ediyor, bu da Kivy'nin Window/GL
        # singleton'ını tetikliyor. Runner'da gerçek GPU yok — native sürücü
        # yalnızca OpenGL 1.1 veriyor (Kivy 2.0 istiyor), süreç CRITICAL ile
        # çöküp temiz kapanmıyor ve analiz adımı asılı kalıyor. Bu, her
        # derlemenin başından beri 6 saatte zaman aşımına uğramasının GERÇEK
        # sebebiydi (bkz. archlence.spec'in başındaki not). ANGLE, GPU
        # olmadan da OpenGL ES'i DirectX'e çevirip 2.0+ bağlam sağlıyor.
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: Ham .exe klasörünü artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Archlence-Windows
          path: dist/Archlence/
          if-no-files-found: error

      - name: Inno Setup ile tek dosyalık kurulum paketi oluştur
        # windows-latest runner'ında Chocolatey zaten kurulu — Inno Setup'ı
        # ayrıca indirip kurmaya gerek yok. ISCC.exe'yi PATH üzerinden DEĞİL,
        # tam yoluyla çağırıyoruz: choco'nun PATH'e eklediği değişiklik aynı
        # `run:` adımının (aynı kabuk oturumu) İÇİNDE her zaman hemen
        # görünmeyebiliyor — bilinen bir Chocolatey/PowerShell pürüzü.
        #
        # NEDEN: dist/Archlence/ bir "onedir" çıktısı (.exe + yanında DLL/
        # kaynak klasörü, bkz. archlence.spec) — son kullanıcı zip açıp
        # klasör bütünlüğünü kendi koruma zorunda kalmasın diye installer/
        # archlence.iss bunu TEK bir ArchlenceSetup.exe'ye sarmalıyor.
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\archlence.iss

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Archlence-Setup
          path: installer_output/ArchlenceSetup.exe
          if-no-files-found: error
