name: Build Windows EXE

# Sadece Windows runner'da çalışır çünkü PyInstaller çapraz derleme yapamaz.
# main dalına her push'ta ve elle tetiklemede (workflow_dispatch) çalışır.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Arka arkaya push'ta eski derleme iptal edilsin; iki Windows runner'ını aynı
# anda 20+ dakika meşgul etmenin anlamı yok.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Bu sınır olmadan takılan bir adım varsayılan 360 dakikaya kadar runner'ı
    # meşgul ediyor ve elle iptal gerekiyor (34 dakikalık "PyInstaller ile
    # derle" adımı böyle oluşmuştu).
    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # bağımlılıkları her koşuda baştan indirmesin

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: PyInstaller ile derle
        # --noconfirm: dist/ zaten varsa PyInstaller "silinsin mi? (y/N)" diye
        # sorup girdi bekler; CI'da bu, sonsuza kadar asılı kalmak demektir.
        # --log-level WARN: INFO binlerce "analyzing module ..." satırı basıp
        # gerçek uyarıları gömüyordu.
        #
        # KIVY_GL_BACKEND=angle_sdl2: archlence.spec'teki `collect_all("kivymd")`
        # kivymd'yi gerçekten import ediyor, bu da Kivy'nin Window/GL
        # singleton'ını tetikliyor. Runner'da gerçek GPU yok — native sürücü
        # yalnızca OpenGL 1.1 veriyor (Kivy 2.0 istiyor), süreç CRITICAL ile
        # çöküp temiz kapanmıyor ve analiz adımı asılı kalıyor. Bu, her
        # derlemenin başından beri 6 saatte zaman aşımına uğramasının GERÇEK
        # sebebiydi (bkz. archlence.spec'in başındaki not). ANGLE, GPU
        # olmadan da OpenGL ES'i DirectX'e çevirip 2.0+ bağlam sağlıyor.
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: .exe'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Archlence-Windows
          path: dist/Archlence/
          if-no-files-found: error
