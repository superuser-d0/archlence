name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

  workflow_call:
    inputs:
      version:
        description: "Kurulum paketine gömülecek sürüm (etiketten türetilir)."
        required: false
        type: string
        default: "0.0.12"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:

          fetch-depth: 0

      - name: Python kur

        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip   # bağımlılıkları her koşuda baştan indirmesin

      - name: Bağımlılıkları kur

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: PyInstaller ile derle

        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: pyinstaller --noconfirm --log-level WARN archlence.spec
        timeout-minutes: 20

      - name: "Smoke test: Archlence.exe gerçekten açılıyor mu"

        shell: pwsh
        env:
          KIVY_GL_BACKEND: angle_sdl2
        run: |
          $ErrorActionPreference = "Stop"
          $crashLogDir = python -c "from utils.app_paths import log_dir; print(log_dir())"
          $crashLogPath = Join-Path $crashLogDir "crash.log"
          $beforeSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }

          $proc = Start-Process -FilePath "dist\Archlence\Archlence.exe" -PassThru
          Start-Sleep -Seconds 10

          $stillAlive = -not $proc.HasExited
          if (-not $stillAlive) {
            Write-Host "::error::Archlence.exe 10 saniye içinde kendiliğinden kapandı (exit code: $($proc.ExitCode)) — muhtemelen Window sessizce None kaldı (bkz. archlence.spec'teki KIVY_GL_BACKEND notu)."
          }

          $afterSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }
          $crashLogGrew = $afterSize -gt $beforeSize
          if ($crashLogGrew) {
            Write-Host "::error::crash.log bu çalıştırma sırasında büyüdü — yakalanmış ama sessiz kalmış bir istisna olabilir. Son satırlar:"
            Get-Content $crashLogPath -Tail 40
          }

          if ($stillAlive) {
            Stop-Process -Id $proc.Id -Force
          }

          if ((-not $stillAlive) -or $crashLogGrew) {
            exit 1
          }
          Write-Host "Smoke test geçti: Archlence.exe 10 saniye sonra hâlâ çalışıyordu, crash.log'a yeni yazı yok."

      - name: "Paketleme bütünlüğü: pywin32'nin tembel importu da pakette mi"

        run: python scripts/check_frozen_lazy_imports.py dist/Archlence

      - name: Paket içeriği ve secret taraması
        run: python scripts/inspect_package_contents.py dist/Archlence

      - name: Ham .exe klasörünü artifact olarak yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Windows
          path: dist/Archlence/
          if-no-files-found: error

      - name: Inno Setup ile tek dosyalık kurulum paketi oluştur

        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
            Write-Host "inputs.version bos; merkezi kaynaktan alindi: $version"
          }
          $central = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -ne $central) {
            Write-Host "::error::Verilen surum ($version) uygulama surumuyle ($central) uyusmuyor."
            exit 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Gecersiz surum bicimi: $version"
            exit 1
          }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            installer\archlence.iss

      - name: "Upgrade smoke: önceki sürüm profilini yeni sürümle aç"
        shell: pwsh

        timeout-minutes: 10
        env:
          KIVY_GL_BACKEND: angle_sdl2

          UPGRADE_BASELINE_TAG: ""
          UPGRADE_BASELINE_ASSET: ""
          UPGRADE_BASELINE_SHA256: ""
        run: |
          $ErrorActionPreference = "Stop"

          $target = (python -c "from utils.version import APP_VERSION; print(APP_VERSION)").Trim()
          git fetch --tags --quiet
          $baseline = (python scripts/previous_release.py --target $target).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseline)) {
            Write-Host "::warning::Yükseltme smoke testi ATLANDI: $target için önceki yayın bulunamadı."
            exit 0
          }
          $baselineVersion = $baseline.TrimStart("v")
          $env:UPGRADE_BASELINE_TAG = $baseline
          $env:UPGRADE_BASELINE_ASSET = "ArchlenceSetup-$baselineVersion.exe"
          Write-Host "Yükseltme tabanı: $baseline -> $target"

          $sumsUrl = "https://github.com/${{ github.repository }}/releases/download/$baseline/SHA256SUMS.txt"
          try {

            $response = Invoke-WebRequest $sumsUrl -TimeoutSec 180
            $sums = if ($response.Content -is [byte[]]) {
              [System.Text.Encoding]::UTF8.GetString($response.Content)
            } else {
              [string]$response.Content
            }
          } catch {
            Write-Host "::error::Taban yayının SHA256SUMS.txt dosyası indirilemedi: $sumsUrl"
            exit 1
          }
          $line = ($sums -split "`n") | Where-Object { $_ -match [regex]::Escape($env:UPGRADE_BASELINE_ASSET) } | Select-Object -First 1
          if (-not $line) {
            Write-Host "::error::$($env:UPGRADE_BASELINE_ASSET) taban manifestinde bulunamadı."
            exit 1
          }
          $env:UPGRADE_BASELINE_SHA256 = ($line -split "\s+")[0]

          function Invoke-Bounded {
            param($Proc, [int]$TimeoutSeconds, [string]$Label)
            if (-not $Proc.WaitForExit($TimeoutSeconds * 1000)) {
              try { $Proc.Kill() } catch { }
              Write-Host "::error::$Label $TimeoutSeconds saniyede tamamlanmadı (askıda kaldı)."
              exit 1
            }
            [void]$Proc.WaitForExit(10000)
            return $Proc.ExitCode
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Archlence-Upgrade"
          $oldInstaller = Join-Path $env:RUNNER_TEMP $env:UPGRADE_BASELINE_ASSET
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:UPGRADE_BASELINE_TAG)/$($env:UPGRADE_BASELINE_ASSET)"
          try {

            Invoke-WebRequest $url -OutFile $oldInstaller -TimeoutSec 180
          } catch {
            Write-Host "::error::Taban sürüm indirilemedi: $url"
            exit 1
          }
          $oldHash = (Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLower()
          if ($oldHash -ne $env:UPGRADE_BASELINE_SHA256.ToLower()) {
            Write-Host "::error::Taban kurulum paketinin hash'i eşleşmiyor."
            exit 1
          }
          $oldSetup = Start-Process $oldInstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          if ((Invoke-Bounded $oldSetup 120 "Taban kurulum") -ne 0) { exit 1 }
          $oldExe = Join-Path $installDir "Archlence.exe"
          $oldProc = Start-Process $oldExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          if ($oldProc.HasExited) {
            Write-Host "::error::Taban sürüm çalışır durumda kalmadı."
            exit 1
          }
          Stop-Process -Id $oldProc.Id -Force

          $db = Get-ChildItem $env:LOCALAPPDATA -Filter finance.db -Recurse |
            Where-Object { $_.FullName -match "Archlence" } |
            Select-Object -First 1
          if (-not $db) {
            Write-Host "::error::Taban sürümün profil veritabanı oluşmadı."
            exit 1
          }
          python -c "import sqlite3; p=r'$($db.FullName)'; c=sqlite3.connect(p); c.execute('INSERT INTO accounts (name,type,balance) VALUES (?,?,?)',('upgrade-sentinel','bank',1234.56)); c.commit(); c.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $newInstaller = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $upgrade = Start-Process $newInstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          if ((Invoke-Bounded $upgrade 120 "Yükseltme kurulumu") -ne 0) { exit 1 }
          $newProc = Start-Process $oldExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          if ($newProc.HasExited) {
            Write-Host "::error::Yükseltilmiş sürüm çalışır durumda kalmadı."
            exit 1
          }
          Stop-Process -Id $newProc.Id -Force
          python -c "import sqlite3; p=r'$($db.FullName)'; c=sqlite3.connect(p); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; assert c.execute('select balance from accounts where name=?',('upgrade-sentinel',)).fetchone()[0]==1234.56; c.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $remove = Start-Process $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $removeExit = Invoke-Bounded $remove 120 "Yükseltme sonrası kaldırma"
          if ($removeExit -ne 0 -or -not (Test-Path $db.FullName)) {
            Write-Host "::error::Yükseltme sonrası kaldırma kullanıcı verisini korumadı."
            exit 1
          }
          Write-Host "$($env:UPGRADE_BASELINE_TAG) -> mevcut sürüm yükseltme/profil koruma testi geçti."

      - name: "Smoke test: installer kur, çalıştır ve kaldır"
        shell: pwsh

        timeout-minutes: 10
        env:
          KIVY_GL_BACKEND: angle_sdl2

        run: |

          function Invoke-Bounded {
            param($Proc, [int]$TimeoutSeconds, [string]$Label)
            if (-not $Proc.WaitForExit($TimeoutSeconds * 1000)) {
              try { $Proc.Kill() } catch { }
              Write-Host "::error::$Label $TimeoutSeconds saniyede tamamlanmadı (askıda kaldı)."
              exit 1
            }
            [void]$Proc.WaitForExit(10000)
            return $Proc.ExitCode
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Archlence-Installed"
          $installer = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $setup = Start-Process -FilePath $installer -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", `
              "/SP-", "/DIR=$installDir"
          $setupExit = Invoke-Bounded $setup 120 "Installer"
          if ($setupExit -ne 0) {
            Write-Host "::error::Installer başarısız (exit=$setupExit)."
            exit 1
          }
          $exe = Join-Path $installDir "Archlence.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Kurulan Archlence.exe bulunamadı."
            exit 1
          }
          $crashLogDir = python -c "from utils.app_paths import log_dir; print(log_dir())"
          $crashLogPath = Join-Path $crashLogDir "crash.log"
          $beforeSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }

          $dataDir = python -c "from utils.app_paths import data_dir; print(data_dir())"

          $proc = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 10

          $exitedEarly = $proc.HasExited
          if ($exitedEarly) {
            Write-Host "::error::Kurulu uygulama erken kapandı (exit=$($proc.ExitCode))."
          }

          $afterSize = if (Test-Path $crashLogPath) { (Get-Item $crashLogPath).Length } else { 0 }
          $crashLogGrew = $afterSize -gt $beforeSize
          if ($crashLogGrew) {
            Write-Host "::error::Kurulu uygulama ayakta kaldı ama crash.log büyüdü — yakalanmış ama sessiz kalmış bir istisna olabilir. Son satırlar:"
            Get-Content $crashLogPath -Tail 40
          }

          if (-not $exitedEarly) {
            Stop-Process -Id $proc.Id -Force
          }
          if ($exitedEarly -or $crashLogGrew) {
            exit 1
          }

          $dbPath = Join-Path $dataDir "finance.db"
          if (-not (Test-Path $dbPath)) {
            Write-Host "::error::Kurulu uygulama açıldı ama kullanıcı profilini ($dbPath) oluşturmadı."
            exit 1
          }
          $dbSizeBefore = (Get-Item $dbPath).Length

          $uninstaller = Join-Path $installDir "unins000.exe"
          $remove = Start-Process -FilePath $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $removeExit = Invoke-Bounded $remove 120 "Kaldırma"
          if ($removeExit -ne 0 -or (Test-Path $exe)) {
            Write-Host "::error::Kaldırma doğrulanamadı."
            exit 1
          }

          if (-not (Test-Path $dbPath)) {
            Write-Host "::error::Kaldırma kullanıcı veritabanını SİLDİ ($dbPath). installer/archlence.iss'e UninstallDelete eklenmiş olabilir."
            exit 1
          }
          $dbSizeAfter = (Get-Item $dbPath).Length
          if ($dbSizeAfter -ne $dbSizeBefore) {
            Write-Host "::error::Kaldırma kullanıcı veritabanını DEĞİŞTİRDİ ($dbSizeBefore -> $dbSizeAfter bayt)."
            exit 1
          }
          Write-Host "Installer smoke testi geçti (kullanıcı verisi kaldırmadan sonra korundu)."

      - name: "Kurulum kapsamı: VARSAYILAN hedef kullanıcı profili altında mı"
        shell: pwsh
        timeout-minutes: 5

        run: |
          $installer = (Resolve-Path "installer_output\ArchlenceSetup.exe").Path
          $setup = Start-Process -FilePath $installer -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"
          if (-not $setup.WaitForExit(120000)) {
            try { $setup.Kill() } catch { }
            Write-Host "::error::Varsayılan hedefe kurulum 120 saniyede tamamlanmadı."
            exit 1
          }
          [void]$setup.WaitForExit(10000)
          if ($setup.ExitCode -ne 0) {
            Write-Host "::error::Varsayılan hedefe kurulum başarısız (exit=$($setup.ExitCode))."
            exit 1
          }
          $expected = Join-Path $env:LOCALAPPDATA "Programs\Archlence"
          $exe = Join-Path $expected "Archlence.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Varsayılan kurulum $expected altında bulunamadı; kapsam kullanıcı profilinden çıkmış olabilir."
            Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  bulunan: $($_.FullName)" }
            exit 1
          }
          if (Test-Path (Join-Path $env:ProgramFiles "Archlence")) {
            Write-Host "::error::Kurulum makine geneli konuma (Program Files) yazdı — kullanıcı başına kurulum iddiası bozuldu."
            exit 1
          }
          Write-Host "Varsayılan kurulum hedefi doğrulandı: $expected"
          $uninstaller = Join-Path $expected "unins000.exe"
          $remove = Start-Process -FilePath $uninstaller -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          [void]$remove.WaitForExit(120000)
          [void]$remove.WaitForExit(10000)

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Archlence-Setup
          path: installer_output/ArchlenceSetup.exe
          if-no-files-found: error
