name: Build Windows EXE

# Sadece Windows runner'da çalışır çünkü PyInstaller çapraz derleme yapamaz.
# main dalına her push'ta ve elle tetiklemede (workflow_dispatch) çalışır.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: PyInstaller ile derle
        run: pyinstaller finora.spec

      - name: .exe'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Finora-Windows
          path: dist/Finora/
          if-no-files-found: error
