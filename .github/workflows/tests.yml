name: Tests

# Windows build (build-windows.yml) packages the app; this workflow verifies
# it's actually correct. Runs on Linux — the unit test suite and lint don't
# need PyInstaller or a Windows runner, and this is far cheaper/faster.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Yalnızca requirements-runtime.txt: bu job uygulamayı (ve dolayısıyla
        # test suite'ini) çalıştırıyor, lint araçlarına ihtiyacı yok.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run test suite
        # KIVY_NO_ARGS: Kivy otherwise tries to parse this workflow's own
        # argv as its own CLI flags. run_tests.py now propagates a non-zero
        # exit code on failure (previously always exited 0 regardless of
        # test results, which would have made this check meaningless).
        #
        # ARCHLENCE_HEADLESS: main.py no longer silently falls back to stub
        # UI classes unless this is explicitly set (docs/ROADMAP.md Faz 1
        # madde 2 — the old DISPLAY-based guess was actively broken).
        # run_tests.py already sets this itself before test discovery, so
        # it's redundant here on purpose: explicit at the workflow level
        # too, matching KIVY_NO_ARGS, rather than relying solely on a
        # default buried in a script.
        env:
          KIVY_NO_ARGS: "1"
          ARCHLENCE_HEADLESS: "1"
        run: python run_tests.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install flake8
        # requirements-dev.txt is the single source for the pinned version,
        # so the finding count can't silently drift from what was verified
        # locally (2026-07-27: 117 F-code findings) just because this step's
        # own inline pin fell out of sync with it.
        run: python -m pip install -r requirements-dev.txt

      - name: Report pyflakes findings (informational, non-blocking)
        # Intentionally does not fail the build. --select=F limits this to
        # pyflakes (unused imports, undefined names, redefinitions — actual
        # correctness signals), not pycodestyle style rules: unrestricted
        # flake8 currently reports 2000+ pre-existing line-length findings
        # that would fail every future PR regardless of what changed.
        # Promote this to a required, blocking check once the F-code
        # backlog (117 as of 2026-07-27, see docs/ROADMAP.md) is cleared.
        continue-on-error: true
        run: python -m flake8 --select=F --count .
