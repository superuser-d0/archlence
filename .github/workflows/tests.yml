name: Tests

# Windows build (build-windows.yml) packages the app; this workflow verifies
# it's actually correct. Lint, type-check ve görsel regresyon Linux'ta koşar
# (ucuz ve hızlı); test paketi HEM Linux HEM Windows'ta koşar.
#
# Windows'ta neden ayrıca koşuyoruz: build-windows.yml yalnızca "kuruluyor,
# açılıyor, kaldırılıyor" diyordu — uygulama MANTIĞININ orada da doğru olduğunu
# hiçbir şey doğrulamıyordu. Kullanıcı tarafından bildirilen hataların (tutar
# alanının yazılandan farklı sayı kaydetmesi, hızlı dokunmada kasma) hepsi
# platformdan bağımsız mantık hatalarıydı ama ilk kez Windows'ta fark edildi;
# geliştirme Linux'ta yapıldığı için Windows tarafında hiç kanıt üretilmiyordu.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Test paketi GERÇEK etiket geçmişini okuyor
          # (`test_real_repository_history_selects_008_for_009` ->
          # `previous_release.py` -> `git tag`). Varsayılan checkout etiket
          # çekmiyor ve `fetch-tags: true` BURADA İŞE YARAMIYOR: checkout ref'i
          # bir SHA olarak fetch ettiğinde komuta `--tags` eklemiyor, ölçtük.
          # `fetch-depth: 0` etiketleri kesin getiriyor — `reliability-gates`
          # zaten bu yüzden onu kullanıyor.
          # Etiketsiz koşup testi atlamak, kapıyı ölçmeden yeşile çevirirdi.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Yalnızca requirements-runtime.txt: bu job uygulamayı (ve dolayısıyla
        # test suite'ini) çalıştırıyor, lint araçlarına ihtiyacı yok.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run test suite
        # KIVY_NO_ARGS: Kivy otherwise tries to parse this workflow's own
        # argv as its own CLI flags. run_tests.py now propagates a non-zero
        # exit code on failure (previously always exited 0 regardless of
        # test results, which would have made this check meaningless).
        #
        # ARCHLENCE_HEADLESS: main.py no longer silently falls back to stub
        # UI classes unless this is explicitly set (docs/ROADMAP.md Faz 1
        # madde 2 — the old DISPLAY-based guess was actively broken).
        #
        # SDL_VIDEODRIVER / KIVY_WINDOW: this runner has no display server
        # at all. Without these, Kivy's provider search reaches the raw
        # (non-SDL2) x11 provider, which hard-crashes the whole process
        # (exit 102) on a low-level Xlib connect() failure — no Python
        # exception, so ARCHLENCE_HEADLESS alone can't save it. dummy/sdl2
        # keep the search inside SDL2's own headless-capable path.
        #
        # run_tests.py already sets all three itself before test discovery
        # (required — Kivy fixes its own provider list on the first `import
        # kivy` anywhere in the process, which can happen via a mixin
        # before main.py ever runs), so this is redundant on purpose:
        # explicit at the workflow level too, rather than relying solely on
        # a default buried in a script.
        env:
          KIVY_NO_ARGS: "1"
          ARCHLENCE_HEADLESS: "1"
          SDL_VIDEODRIVER: "dummy"
          KIVY_WINDOW: "sdl2"
        run: python run_tests.py

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Test paketi GERÇEK etiket geçmişini okuyor
          # (`test_real_repository_history_selects_008_for_009` ->
          # `previous_release.py` -> `git tag`). Varsayılan checkout etiket
          # çekmiyor ve `fetch-tags: true` BURADA İŞE YARAMIYOR: checkout ref'i
          # bir SHA olarak fetch ettiğinde komuta `--tags` eklemiyor, ölçtük.
          # `fetch-depth: 0` etiketleri kesin getiriyor — `reliability-gates`
          # zaten bu yüzden onu kullanıyor.
          # Etiketsiz koşup testi atlamak, kapıyı ölçmeden yeşile çevirirdi.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          # Paketlemeyle AYNI sürüm (bkz. build-windows.yml). Testin,
          # kullanıcıya giden .exe'nin çalıştırdığı yorumlayıcıyı temsil
          # etmesi gerekiyor.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # kivy_deps.*: Kivy'nin Windows'taki SDL2/GLEW/ANGLE DLL'lerini
        # sağlar. `SDL_VIDEODRIVER=dummy` ile bile SDL2 DLL'i yüklenmek
        # zorunda — Linux'ta bunlar sistem paketlerinden geliyor, Windows'ta
        # gelmiyor.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: Run test suite
        # Linux job'ıyla AYNI headless sözleşmesi (gerekçeler orada ayrıntılı).
        # run_tests.py bunları kendisi de set eder; burada açıkça tekrar
        # edilmesi bilinçli.
        env:
          KIVY_NO_ARGS: "1"
          ARCHLENCE_HEADLESS: "1"
          SDL_VIDEODRIVER: "dummy"
          KIVY_WINDOW: "sdl2"
        run: python run_tests.py

  reliability-gates:
    # AĞIR GÜVENİLİRLİK KAPILARI — normal unit suite'e uygun değiller ama
    # ZORUNLU. Her biri gerçekten koşuyor; "script dosyası var" diye yeşil
    # olmuyorlar.
    #
    # Neden ayrı job: mutation matrisleri her vaka için ayrı bir git worktree
    # kurup kapıyı yeniden çalıştırıyor, migration matrisi sekiz sürümün
    # veritabanını üretip göç ettiriyor. Bunları her PR unit koşumuna eklemek
    # süreyi katlar; ayrı job olarak koşup yine de merge'ü bloklarlar.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Mutation matrisi `git worktree` kullanıyor ve migration matrisi
          # eski sürüm etiketlerine ihtiyaç duyuyor.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the system library Kivy loads at import time
        # `kivy.input.providers` KOŞULSUZ olarak `mtdev`'i import ediyor ve o
        # da `libmtdev.so.1`'i `cdll.LoadLibrary` ile yüklüyor. Runner'da bu
        # kütüphane yok; migration matrisinin alt süreçleri uygulama kodunu
        # yüklerken `OSError` ile ölüyordu. Headless ortam değişkenleri bunu
        # ÇÖZMÜYOR — import koşula bağlı değil, eksik olan sistem kütüphanesi.
        #
        # `test` job'ında görülmüyor çünkü orası Kivy'nin girdi sağlayıcı
        # taramasına hiç ulaşmıyor. Geliştirici makinelerinde kütüphane zaten
        # kurulu; bu yüzden yalnızca CI'da ortaya çıktı.
        run: sudo apt-get update && sudo apt-get install -y libmtdev1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version consistency mutation matrix (16 cases)
        # Sürüm kaynaklarının her birini tek tek bozup kapının yakaladığını
        # doğrular. Kaçan vaka varsa çıkış kodu 1.
        run: python scripts/audit/version_mutation_matrix.py

      - name: Schema and migration matrix (v0.0.1 - v0.0.8)
        # EKRAN GEREKMİYOR — ve bu bilinçli bir tasarım, eksiklik değil.
        # Worker eskiden `import main` yapıyordu; main Kivy'yi import edince
        # import ANINDA pencere sağlayıcısı aranıyor, ekransız runner'da
        # bulunamayınca `sys.exit(1)`. Ortamı yeterli kılmak için beş deneme
        # harcandı (headless değişkenler, libmtdev, sanal ekran, SDL sürücü
        # seçimi) ve her biri bir sonraki katmanı açtı.
        #
        # `1ffc6f6` yönü çevirdi: o import zaten yerini hak etmiyordu.
        # `tests/test_startup_import.py` main'in headless import edildiğini
        # HEM Linux HEM Windows'ta zaten doğruluyor, üstelik main import
        # sırasında veritabanına dokunmuyor (şema işi `build()` içinde) —
        # yani "migrate edilmiş veritabanına karşı import" düz bir import'la
        # aynı şeydi. Bu kapının ölçmesi gereken katman veriye DOKUNAN
        # katman: services/database/utils, ve onlar hiç Kivy import etmiyor.
        #
        # Worker artık o on bir modülü import ediyor ve `sys.modules` içinde
        # kivy belirirse yüksek sesle patlıyor; bir GUI bağımlılığı geri
        # sızarsa ekran ihtiyacı sessizce geri gelmesin diye.
        run: |
          python scripts/audit/check_schema_consistency.py \
            --output migration-matrix.json

      - name: Adversarial financial reproductions
        # Bu testler v0.0.9 düzeltmelerinden SONRA yeşil olmalı. Kırmızıya
        # dönmeleri bir düzeltmenin geri gittiği anlamına gelir.
        run: |
          python -m unittest \
            scripts.audit.test_adversarial_reproductions \
            scripts.audit.test_phase2_additional_reproductions \
            scripts.audit.test_migration_fault_injection \
            scripts.audit.test_phase2_backup_archive \
            scripts.audit.test_phase2_concurrency \
            scripts.audit.test_phase2_nonfinite_matrix \
            scripts.audit.test_ci_required_checks_contract

      - name: Financial property tests (hypothesis)
        run: python -m unittest scripts.audit.test_phase2_financial_properties

      - name: Dependency vulnerability scan
        # PAKETLENEN bağımlılıklar taranıyor (requirements-runtime.txt), lint
        # araçları değil: kullanıcıya giden .exe'nin içindekiler bunlar.
        #
        # BLOKLUYOR. `continue-on-error` bilerek YOK — bu tarama Phase 2'den
        # v0.0.9'a kadar hiç koşmamıştı ve ilk koşumda 3 pakette 18 benzersiz
        # bulgu çıktı; bilgilendirici bırakılsaydı aynı sessizlik sürerdi.
        #
        # Yeni bir öneri gerçekten düzeltilemiyorsa çözüm `|| true` DEĞİL,
        # `--ignore-vuln <ID>` ile gerekçesini yazarak tek tek muaf tutmaktır;
        # böylece muafiyet görünür kalır.
        run: python -m pip_audit -r requirements-runtime.txt --strict

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reliability-matrices
          path: migration-matrix.json
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint and type-check dependencies
        # requirements-dev.txt is the single source for the pinned version,
        # so the finding count can't silently drift from what was verified
        # locally (2026-07-27: 117 F-code findings) just because this step's
        # own inline pin fell out of sync with it.
        #
        # RUNTIME BAĞIMLILIKLARI DA KURULUYOR — mypy içindir, flake8 için
        # değil. Yalnız dev bağımlılıklarıyla, üretimde var olan paketler
        # (Pillow, requests, keyring...) tip denetleyici için YOK sayılıyor ve
        # `ignore_missing_imports` onları `Any`'ye düşürüyor; o modüllerle
        # olan sınırımızdaki hatalar sessizce görünmez oluyordu.
        #
        # Ölçüldü: aynı ağaçta `mypy services database` dev-only ortamda 8,
        # runtime+dev ortamında 11 hata veriyordu. Aradaki üçü Pillow sınırı.
        # Yani "CI'da mypy 0" iddiası, ancak üretim bağımlılık grafiği tip
        # denetleyici tarafından görülebiliyorsa bir şey ifade ediyor.
        run: |
          python -m pip install -r requirements-runtime.txt
          python -m pip install -r requirements-dev.txt

      - name: Block critical pyflakes and bare except errors
        run: >-
          python -m flake8 .
          --select=F821,F822,F823,E722
          --exclude=.venv,venv,build,dist,.git,AppDir
          --count

      # ARTIK BLOKLUYOR (docs/ROADMAP.md Faz 0 kapandı).
      #
      # Bu adım uzun süre `continue-on-error: true` ile bilgilendiriciydi,
      # çünkü 122 mevcut ihlal vardı ve zorunlu yapmak her PR'ı ilgisiz
      # sebeplerle kırardı. v0.0.9'da borç sıfırlandı: 15 F401 ölü import
      # kaldırıldı, 98 F841 kullanılmayan `except ... as e` bağı temizlendi,
      # kalan 2 F841 ise servis katmanına taşınmış işin ölü kalıntısıydı
      # (`AssetSaleService.sell` açıklaması, `DebtPaymentService.pay_auto`
      # is_active hesabı) — ikisi de silindi.
      #
      # Sayı 0 olduğu için kapı artık bedava: yeni bir ihlal ancak o PR'ın
      # kendi getirdiği ihlaldir. Tekrar `continue-on-error` eklemek yerine
      # ihlali düzeltin; backlog'un nasıl biriktiğini bu dosyanın geçmişi
      # zaten gösteriyor.
      - name: Block the full pyflakes set
        run: >-
          python -m flake8 .
          --select=F
          --exclude=.venv,venv,build,dist,.git,AppDir
          --count

      - name: Prevent new broad or silent exception handlers
        run: >-
          python scripts/audit_exception_handlers.py
          --check .github/exception-baseline.json

      - name: Type-check the production core
        # ARTIK DOSYA LİSTESİ DEĞİL, İKİ PAKET. Elle sayılan on bir dosya
        # kapsamı, yeni bir servis eklendiğinde onu sessizce dışarıda
        # bırakıyordu; `services` ve `database` demek, çekirdeğin tamamını
        # kapsam içinde tutuyor.
        #
        # `mypy.ini`'deki `follow_imports = normal` ile birlikte, bu iki
        # paketin import ettiği `utils` modülleri de denetleniyor. `utils`
        # AĞACININ TAMAMI kapsamda değil: `services`/`database` tarafından
        # hiç import edilmeyen UI yardımcıları (toast, single_instance,
        # calculator) bilerek dışarıda — onlar Kivy tarafıyla birlikte ayrı
        # bir turda ele alınacak.
        run: python -m mypy services database

      - name: Sürüm metadata tutarlılığı
        run: python scripts/check_version_consistency.py

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dpi: ["96", "192"]
        language: ["tr", "en"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SDL/Xvfb test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -r requirements-runtime.txt
      - name: Search bar visual contracts
        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-visual-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-visual-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-visual-state
        run: >-
          xvfb-run -a python scripts/dev/verify_search_bar_visual.py
          --output visual/search-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Asset dialog geometry contracts
        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-visual-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-visual-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-visual-state
        run: >-
          xvfb-run -a python scripts/dev/verify_asset_dialog_layout.py
          --output visual/assets-${{ matrix.language }}-${{ matrix.dpi }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: visual-${{ matrix.language }}-${{ matrix.dpi }}
          path: visual/
