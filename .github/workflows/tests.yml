name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:

          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run test suite
        # KIVY_NO_ARGS: Kivy otherwise tries to parse this workflow's own
        # argv as its own CLI flags. run_tests.py now propagates a non-zero
        # exit code on failure (previously always exited 0 regardless of
        # test results, which would have made this check meaningless).
        #
        # ARCHLENCE_HEADLESS: main.py no longer silently falls back to stub
        # UI classes unless this is explicitly set (the old DISPLAY-based
        # guess was actively broken).
        #
        # SDL_VIDEODRIVER / KIVY_WINDOW: this runner has no display server
        # at all. Without these, Kivy's provider search reaches the raw
        # (non-SDL2) x11 provider, which hard-crashes the whole process
        # (exit 102) on a low-level Xlib connect() failure — no Python
        # exception, so ARCHLENCE_HEADLESS alone can't save it. dummy/sdl2
        # keep the search inside SDL2's own headless-capable path.
        #
        # run_tests.py already sets all three itself before test discovery
        # (required — Kivy fixes its own provider list on the first `import
        # kivy` anywhere in the process, which can happen via a mixin
        # before main.py ever runs), so this is redundant on purpose:
        # explicit at the workflow level too, rather than relying solely on
        # a default buried in a script.
        env:
          KIVY_NO_ARGS: "1"
          ARCHLENCE_HEADLESS: "1"
          SDL_VIDEODRIVER: "dummy"
          KIVY_WINDOW: "sdl2"
        run: python run_tests.py

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:

          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:

          python-version: "3.12"
          cache: pip

      - name: Install dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: Run test suite

        env:
          KIVY_NO_ARGS: "1"
          ARCHLENCE_HEADLESS: "1"
          SDL_VIDEODRIVER: "dummy"
          KIVY_WINDOW: "sdl2"
        run: python run_tests.py

  reliability-gates:

    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:

          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the system library Kivy loads at import time

        run: sudo apt-get update && sudo apt-get install -y libmtdev1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Version consistency mutation matrix (16 cases)

        run: python scripts/audit/version_mutation_matrix.py

      - name: Schema and migration matrix (v0.0.1 - v0.0.8)

        run: |
          python scripts/audit/check_schema_consistency.py \
            --output migration-matrix.json

      - name: Adversarial financial reproductions

        run: |
          python -m unittest \
            scripts.audit.test_adversarial_reproductions \
            scripts.audit.test_phase2_additional_reproductions \
            scripts.audit.test_migration_fault_injection \
            scripts.audit.test_phase2_backup_archive \
            scripts.audit.test_phase2_concurrency \
            scripts.audit.test_phase2_nonfinite_matrix \
            scripts.audit.test_ci_required_checks_contract

      - name: Financial property tests (hypothesis)
        run: python -m unittest scripts.audit.test_phase2_financial_properties

      - name: Dependency vulnerability scan

        run: python -m pip_audit -r requirements-runtime.txt --strict

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reliability-matrices
          path: migration-matrix.json
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint and type-check dependencies

        run: |
          python -m pip install -r requirements-runtime.txt
          python -m pip install -r requirements-dev.txt

      - name: Block critical pyflakes and bare except errors
        run: >-
          python -m flake8 .
          --select=F821,F822,F823,E722
          --exclude=.venv,venv,build,dist,.git,AppDir
          --count

      - name: Block the full pyflakes set
        run: >-
          python -m flake8 .
          --select=F
          --exclude=.venv,venv,build,dist,.git,AppDir
          --count

      - name: Prevent new broad or silent exception handlers
        run: >-
          python scripts/audit_exception_handlers.py
          --check .github/exception-baseline.json

      - name: Type-check the production core

        run: python -m mypy services database

      - name: Version metadata consistency
        run: python scripts/check_version_consistency.py

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dpi: ["96", "192"]
        language: ["en"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SDL/Xvfb test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -r requirements-runtime.txt

      - name: Search bar visual contracts
        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-search-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-search-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-search-state
        run: >-
          xvfb-run -a python scripts/dev/verify_search_bar_visual.py
          --output visual/search-${{ matrix.language }}-${{ matrix.dpi }}

      - name: Asset dialog geometry contracts
        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-asset-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-asset-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-asset-state
        run: >-
          xvfb-run -a python scripts/dev/verify_asset_dialog_layout.py
          --output visual/assets-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Icon/text overlap contract

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-icon-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-icon-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-icon-state
        run: >-
          xvfb-run -a python scripts/dev/verify_icon_label_layout.py
          --output visual/icons-${{ matrix.language }}-${{ matrix.dpi }}
      - name: User data remains unchanged in the English UI

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-i18n-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-i18n-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-i18n-state
        run: >-
          xvfb-run -a python scripts/dev/verify_i18n_user_data.py
          --output visual/i18n-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Password change requires the current password

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-pwd-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-pwd-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-pwd-state
        run: >-
          xvfb-run -a python scripts/dev/verify_password_dialog.py
          --output visual/password-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Startup failure screen renders in a real window

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-startup-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-startup-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-startup-state
        run: >-
          xvfb-run -a python scripts/dev/verify_startup_failure_surface.py
          --output visual/startup-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Savings-goal cards are sourced from SQL

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-savings-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-savings-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-savings-state
        run: >-
          xvfb-run -a python scripts/dev/verify_savings_goal_cards.py
          --output visual/savings-${{ matrix.language }}-${{ matrix.dpi }}
      - name: Tab scrolling contract

        env:
          KIVY_DPI: ${{ matrix.dpi }}
          ARCHLENCE_LANGUAGE: ${{ matrix.language }}
          XDG_DATA_HOME: ${{ runner.temp }}/archlence-scroll-data
          XDG_CACHE_HOME: ${{ runner.temp }}/archlence-scroll-cache
          XDG_STATE_HOME: ${{ runner.temp }}/archlence-scroll-state
        run: >-
          xvfb-run -a python scripts/dev/verify_tab_scrolling.py
          --output visual/scroll-${{ matrix.language }}-${{ matrix.dpi }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: visual-${{ matrix.language }}-${{ matrix.dpi }}
          path: visual/
