[mypy]
python_version = 3.12
ignore_missing_imports = True
# `skip` DEĞİL. `skip` ile içe aktarılan her proje modülü `Any`'ye düşüyordu:
# kontrol edilen 11 dosya 15 proje modülü import ediyor ve bunların 8'i
# (database/db.py, services/asset_service.py, utils/crypto.py, ...) hiç
# görülmüyordu. Yani kapsam göründüğünden çok daha dardı — `budget_service`'in
# `get_active_recurring_payments()`'tan ne aldığı doğrulanmıyordu bile.
#
# `normal`'a çevrildiğinde aynı 11 giriş dosyası 12 hata gösterdi ve hepsi
# TRANSİTİF modüllerdeydi; giriş dosyalarının kendisi zaten temizdi. Dokuzu
# tek bir kök nedene bağlıydı: annotation'sız iki modül sözlüğü.
follow_imports = normal
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True

[mypy-kivy.*]
ignore_errors = True

[mypy-kivymd.*]
ignore_errors = True
