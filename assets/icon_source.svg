<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <!-- Zemin: ARCHLENCE_PRIMARY_HEX (#5444E5) — ui/theme.py'deki Premium Mavi
       Tema'nın primary rengiyle birebir aynı, logo arayüzle uyumlu kalsın. -->
  <rect x="0" y="0" width="360" height="360" rx="80" fill="#5444E5"/>
  <!-- "A" gövdesi: keskin tepe, içe kavisli (concave) dış kenarlar sayesinde
       dışa açılan bacaklar ve tabanda açık üçgen boşluk. Eski yaprak/huzme
       formunun yerini aldı: o form 48px'te (görev çubuğu, sistem tepsisi)
       ince huzmeleri kaybolduğu için tamamen okunmaz hâle geliyordu. -->
  <path d="M180,56 Q218,168 294,302 L232,302 Q200,212 180,150 Q160,212 128,302 L66,302 Q142,168 180,56 Z" fill="#FFFFFF"/>
  <!-- Orta çizgi: kavisli bant — eski logodan devralınan imza öğe. Uçları
       BİLEREK bacakların içine taşar; uçları sıfıra incelen mercek biçimi
       bacaklara bağlanmayıp boşlukta yüzen bir leke gibi görünüyordu. -->
  <path d="M138,228 Q180,240 222,228 L222,254 Q180,266 138,254 Z" fill="#FFFFFF"/>
</svg>
